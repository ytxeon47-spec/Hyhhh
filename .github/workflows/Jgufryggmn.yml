name: Custom Windows 10 QEMU (Intel Core i5-11300H & 512GB Disk)

on:
  workflow_dispatch:

jobs:
  run-win10-iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Install QEMU, KVM & Storage (512GB)
        run: |
          echo "=== [STEP 1/4] Installing QEMU, KVM & OVMF Firmware ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            novnc \
            websockify \
            curl \
            wget \
            aria2

          echo "=== Enabling KVM Permissions ==="
          sudo chmod 666 /dev/kvm || true

          echo "=== Creating Virtual Disk (512GB qcow2) ==="
          qemu-img create -f qcow2 /tmp/main_disk.qcow2 512G

      - name: 2. Download Windows 10 ISO
        run: |
          echo "=== [STEP 2/4] Downloading Windows 10 ISO ==="
          
          ISO_URL="https://archive.org/download/windows-10_20250816/Windows10.iso"
          
          echo "Downloading to /tmp/win10.iso..."
          aria2c -x 16 -s 16 -k 1M -d /tmp -o win10.iso "$ISO_URL" || wget -O /tmp/win10.iso "$ISO_URL"
          
          ls -lh /tmp/win10.iso

      - name: 3. Connect Tailscale
        run: |
          echo "=== [STEP 3/4] Connecting Tailscale ==="
          curl -fsSL https://tailscale.com/install.sh | sh
          
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" \
            --hostname="win10-qemu-runner-${{ github.run_id }}" \
            --accept-routes || true
          
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(tailscale ip -4 || true)
              sleep 3
              RETRIES=$((RETRIES+1))
          done
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: 4. Launch QEMU Windows 10 & noVNC Web Access
        run: |
          echo "=== [STEP 4/4] Starting QEMU Windows 10 Machine ==="
          
          # Launch QEMU with Intel Core i5-11300H (4 Cores) & 16 GB RAM
          qemu-system-x86_64 \
            -enable-kvm \
            -m 16384 \
            -smp 4,sockets=1,cores=4,threads=1 \
            -cpu host,model-id="11th Gen Intel(R) Core(TM) i5-11300H @ 3.10GHz",check=false \
            -bios /usr/share/ovmf/OVMF.fd \
            -drive file=/tmp/main_disk.qcow2,format=qcow2,index=0,media=disk \
            -drive file=/tmp/win10.iso,index=1,media=cdrom \
            -vga std \
            -boot d \
            -vnc 127.0.0.1:0 \
            -net nic,model=e1000 \
            -net user \
            -usb -device usb-tablet \
            -daemonize

          sleep 5

          # Safe noVNC path resolution
          NOVNC_DIR="/usr/share/novnc"
          if [ -d "/usr/share/novnc/vnc_lite.html" ] || [ -f "/usr/share/novnc/vnc.html" ] || [ -f "/usr/share/novnc/index.html" ]; then
            NOVNC_DIR="/usr/share/novnc"
          elif [ -d "/usr/share/novnc" ]; then
            NOVNC_DIR="/usr/share/novnc"
          fi

          websockify --web "$NOVNC_DIR" 8006 127.0.0.1:5900 &
          sleep 2

          echo "=================================================="
          echo " WINDOWS 10 QEMU READY"
          echo "=================================================="
          echo " OS Image     : Windows 10 (Archive 20250816)"
          echo " CPU Model    : 11th Gen Intel(R) Core(TM) i5-11300H @ 3.10GHz"
          echo " Graphics     : Standard QEMU VGA (-vga std)"
          echo " Tailscale IP : $TAILSCALE_IP"
          echo " Web VNC URL  : http://$TAILSCALE_IP:8006/vnc.html"
          echo " Storage Size : 512 GB (qcow2)"
          echo " RAM          : 16 GB (16384 MB)"
          echo "=================================================="

          # Keep runner alive for 6 hours
          END_TIME=$(( $(date +%s) + 21600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 300
            echo "QEMU Win10 Running | Tailscale IP: $TAILSCALE_IP | $(date)"
          done
